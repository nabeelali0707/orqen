[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orqen"
version = "0.1.0"
description = "Adaptive tool orchestration with explicit verification and bounded recovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]
ollama = ["httpx>=0.28,<1"]
research = ["httpx>=0.28,<1", "pyyaml>=6,<7"]
web = ["starlette>=0.47,<1", "uvicorn>=0.35,<1"]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
orqen = "orqen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orqen = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
