name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,research,web,mcp]'
      - uses: actions/checkout@v4
        with:
          repository: ServiceNow/AgentArch
          ref: dfdd9cd69642f74d7f2c72738c96faff7b70e59f
          path: runs/upstream/AgentArch
      - run: ruff check src tests examples scripts
      - run: ruff format --check src tests examples scripts
      - run: python -m pytest -q
        env:
          ORQEN_AGENTARCH_CHECKOUT: runs/upstream/AgentArch
      - run: python examples/customer_workflow.py
      - run: python examples/returns_workflow.py
      - run: python -m orqen.cli evaluate --repetitions 1
      - run: python examples/structured_planner.py
      - run: python -m orqen.cli evaluate-catalog
      - run: python -m orqen.cli demo-ollama --model offline-placeholder --dry-run
      - run: python -m orqen.cli demo-hosted --provider mistral --model offline-placeholder --dry-run
      - run: python -m orqen.cli demo-hosted --provider openrouter --model offline-placeholder --dry-run
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/check_wheel.py dist/*.whl
